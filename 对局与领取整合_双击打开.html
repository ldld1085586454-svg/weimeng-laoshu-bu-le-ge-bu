'use strict';
// Shared structural contract only. Replay still computes geometry and triples independently.
const {hashSnapshot}=require('./content-hash');

  for(const c of layout.cells) {

    ids.add(c.id);
    if(!c.rect || !['x','y','w','h'].every(k=>Number.isSafeInteger(c.rect[k])) || c.rect.w<=0 || c.rect.h<=0) fail('INVALID_RECT');
    if(['x','y','w','h'].some(k=>Math.abs(c.rect[k])>MAX_COORDINATE)) fail('COORDINATE_LIMIT');
    if(c.zone==='board') {

      const positions=stacks.get(c.stackId)||[];positions.push(c.position);stacks.set(c.stackId,positions);
    } else fail('INVALID_ZONE');

  }

}

  if(!nonempty(deal.dealId)) fail('INVALID_DEAL_ID');

'use strict';
const {validateLayoutFields}=require('./schema');

/** Positive-area overlap: shadows and edge contact do not block. */
function overlaps(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function validateLayout(layout) {
  validateLayoutFields(layout);
  for(let i=0;i<layout.cells.length;i++) for(let j=i+1;j<layout.cells.length;j++) {
    const a=layout.cells[i],b=layout.cells[j]; if(!overlaps(a.rect,b.rect)) continue;
    if(a.zone!==b.zone) throw new TypeError('MIXED_ZONE_INTERSECTION');
    if(a.zone==='board'&&a.z===b.z) throw new TypeError('AMBIGUOUS_SAME_LAYER_OVERLAP');
    if(a.zone==='side'&&a.stackId!==b.stackId) throw new TypeError('STACK_INTERSECTION');
  }
  return true;
}

function buildGraph(layout) {
  validateLayout(layout);
  const n=layout.cells.length,parents=Array.from({length:n},()=>[]),children=Array.from({length:n},()=>[]);
  function edge(a,b) {parents[b].push(a); children[a].push(b);}
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) {
    const a=layout.cells[i],b=layout.cells[j];
    if(a.zone==='board'&&b.zone==='board'&&overlaps(a.rect,b.rect)) {
      if(a.z>b.z) edge(i,j); else edge(j,i);
    } else if(a.zone==='side'&&b.zone==='side'&&a.stackId===b.stackId) {
      if(a.position===b.position-1) edge(i,j);
      if(b.position===a.position-1) edge(j,i);
    }
  }
  return {parents,children};
}

/** Nonhistorical stress layout. Never label these fixtures original 2022 maps. */
function makeFixtureLayout(n=270) {
  if(!Number.isSafeInteger(n)||n<3||n%3||n>3000) throw new RangeError('N must be 3..3000 and divisible by 3');
  const depth=Math.floor(n/18), main=n-2*depth, cells=[];
  for(let i=0;i<main;i++) {
    const z=Math.floor(i/40),p=i%40,off=(z%2)*50;
    cells.push({id:`m${String(i).padStart(4,'0')}`,zone:'board',z,
      rect:{x:(p%8)*100+off,y:Math.floor(p/8)*100+off,w:96,h:96}});
  }
  for(const [k,stackId] of ['left','right'].entries()) for(let p=0;p<depth;p++)
    cells.push({id:`${stackId}-${String(p).padStart(3,'0')}`,zone:'side',stackId,position:p,
      rect:{x:k*Math.max(500,depth*4+196)+p*4,y:680,w:96,h:96}});
  return {id:`synthetic-layer-stack-${n}`,origin:'SYNTHETIC_NOT_HISTORICAL',cells};
}
module.exports={overlaps,validateLayout,buildGraph,makeFixtureLayout};

'use strict';

const PROFILE=Object.freeze({
  id:'community-working-v03',

'use strict';
// Development-only client permutation. Actual output is logged for deterministic replay.
// The production random source/channel must be bound explicitly during platform integration.
function permute(items,nextU32=()=>Math.floor(Math.random()*4294967296)) {
  if(!Array.isArray(items)||items.length>3000)throw new TypeError('INVALID_SHUFFLE_INPUT');
  function int(n){const limit=Math.floor(4294967296/n)*n;for(let attempt=0;attempt<1024;attempt++){
    const x=nextU32();if(!Number.isInteger(x)||x<0||x>=4294967296)throw new Error('INVALID_RANDOM_VALUE');
    if(x<limit)return x%n;
  }throw new Error('RANDOM_REJECTION_LIMIT');}
  const output=items.slice();for(let i=output.length-1;i>0;i--){const j=int(i+1);[output[i],output[j]]=[output[j],output[i]];}
  return output;

"src/integration/controller":function(module,exports,require){
'use strict';
const Core=require('./round');
const {permute}=require('../play/shuffle');

/** Sync local diagnostic storage: one JSON document contains both entitlement and board.
 * It is not a secure account ledger. Atomic backend entitlement service is still required.
 */

  let state=initial,dirty=false,storageError=null,counter=0;
  const nonce='ctl-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e8).toString(36);

    catch(e){storageError=String(e.message||e);return false;}
  }
  function send(type,extra={},observation=false){
    const c={id:nonce+'-'+(++counter),roundId:state.session.roundId,expectedRevision:state.revision,type,...extra};
    const r=Core.dispatch(state,c);if(!r.ok||r.replayed)return {...r,state:copy(state),saved:!dirty};
    const saved=write(r.state);
    if(!saved&&!observation)return {ok:false,code:'STORAGE_WRITE_FAILED',saved:false,state:copy(state)};
    state=r.state;if(!saved)dirty=true;

    view:()=>copy(state),getSession:()=>copy(state.session),flow:()=>copy(Core.getFlow(state)),
    health:()=>({mode:'development',persistence:storage?'local_diagnostic':'memory_only',dirty,storageError}),

"src/integration/wechat-provider":function(module,exports,require){
'use strict';
/**
 * Optional WeChat SDK preview connector. All real calls are OFF by default.
 * Share hide->show produces return-only evidence, never a send confirmation.
 * No policy approval, server validation, billable impression or cash is inferred.
 */
function createWechatPreviewProvider(wx,config={}) {
  let active=null,disposed=false;
  function detach(a){
    if(!a||!a.ad)return;
    if(a.close&&typeof a.ad.offClose==='function')a.ad.offClose(a.close);
    if(a.error&&typeof a.ad.offError==='function')a.ad.offError(a.error);
  }
  function settle(a,kind,extra={}){

    if(!a.abandoned)a.callback({flowId:a.id,roundId:a.roundId,kind,...extra});
  }
  const hide=()=>{if(active&&active.source==='share')active.hidden=true;};
  const show=()=>{const a=active;if(a&&a.source==='share'&&a.hidden)settle(a,'share_returned');};
  if(typeof wx.onHide==='function')wx.onHide(hide);
  if(typeof wx.onShow==='function')wx.onShow(show);
  function open(source,flow,callback){
    if(disposed)return {ok:false,code:'PROVIDER_DISPOSED'};
    if(active)return {ok:false,code:'PROVIDER_BUSY'};
    if(!flow||typeof flow.id!=='string'||typeof flow.roundId!=='string'||typeof callback!=='function')return {ok:false,code:'INVALID_PROVIDER_REQUEST'};
    if(source==='share'&&(!config.allowSharePreview||typeof wx.shareAppMessage!=='function'))return {ok:false,code:'NATIVE_SHARE_PREVIEW_DISABLED'};
    if(source==='ad'&&(!config.allowAdPreview||!config.adUnitId||typeof wx.createRewardedVideoAd!=='function'))return {ok:false,code:'NATIVE_AD_PREVIEW_DISABLED'};
    if(!['share','ad'].includes(source))return {ok:false,code:'UNKNOWN_SOURCE'};
    const a=active={source,id:flow.id,roundId:flow.roundId,callback,hidden:false};
    try{
      if(source==='share')wx.shareAppMessage({title:config.shareTitle||'三消挑战',query:'source=challenge'});
      else{
